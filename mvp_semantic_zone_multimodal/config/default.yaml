paths:
  reference_image: first_week_data_cleaning/data/metadata/semantic_zone_refs/room1_aug16_17_reference.png
  annotated_image: first_week_data_cleaning/data/metadata/semantic_zone_refs/room1_aug16_17_reference_with_notes.png
  manual_zone_yaml: mvp_semantic_zone_multimodal/config/semantic_zones_room1_aug16_17.yaml
  video_window_index_csv: first_week_data_cleaning/data/processed/metadata/video_window_index.csv
  media_manifest_csv: first_week_data_cleaning/data/processed/metadata/media_manifest.csv
  selected_windows_csv: mvp_video_zone_heatmap/outputs/features/selected_windows.csv
  previous_fourzone_biomarker_csv: mvp_biomarker_state_twin/outputs/features/biomarker_window_table.csv
  previous_fourzone_event_summary_csv: mvp_biomarker_state_twin/outputs/features/event_validation_summary.csv
  existing_audio_window_features_csv: mvp_audio_env_context/outputs/features/audio_window_features.csv
  event_log_csv: mvp_biomarker_state_twin/data/event_log.csv
  env_xlsx: first_week_data_cleaning/data/raw/env/Combined Room 1.xlsx
  output_dir: mvp_semantic_zone_multimodal/outputs

selection:
  target_raw_subdir: video/Room 1/Room 1 (16, 17 Aug)
  target_room_id: room_1

video:
  frame_sample_rate: 0.5
  resize_width: 256
  activity_method: frame_difference
  cache_enabled: true
  force_recompute: false
  force_invalid_zones: false

audio:
  ffmpeg_path: ffmpeg
  sample_rate: 22050
  frame_seconds: 1.0
  cache_enabled: true
  force_recompute: false
  max_report_failures: 25

events:
  caretaker_reference_video_path: first_week_data_cleaning/data/raw/Caretaker Entry Video/Room 1/Week 11/17 Aug/GX330044.MP4
  caretaker_event_id: caretaker_entry_room1_week11_2025_08_17
  caretaker_event_type: caretaker_entry
  caretaker_entry_offset_sec: 183
  caretaker_exit_offset_sec: 300
  baseline_minutes_before_event: 10
  recovery_minutes_after_event: 20
  event_overlap_min_seconds: 1
  env_am_hour_cutoff: 12

model:
  primary_model_name: semantic_video_only
  hmm_n_states: auto
  max_hmm_states: 4
  covariance_type: diag
  random_state: 42
